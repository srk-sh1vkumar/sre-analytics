[mypy]
# Mypy configuration for SRE Analytics

# Import discovery
mypy_path = src
files = src
namespace_packages = True
explicit_package_bases = True

# Platform configuration
python_version = 3.9

# Type checking strictness
check_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
disallow_subclassing_any = True
# Start lenient, increase later
disallow_untyped_calls = False
disallow_untyped_decorators = False
# Start lenient, increase later
disallow_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True

# Error output
show_error_codes = True
show_error_context = True
pretty = True
color_output = True

# Strictness for third-party imports
ignore_missing_imports = True

# Per-module options for gradual typing

[mypy-tests.*]
# Tests can be less strict
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-src.exceptions]
# Exceptions module should be strict
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.config.*]
# Config modules should be strict
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.utils.*]
# Utility modules should be strict
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Third-party library stubs
[mypy-flask.*]
ignore_missing_imports = True

[mypy-jinja2.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-weasyprint.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-pyppeteer.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
