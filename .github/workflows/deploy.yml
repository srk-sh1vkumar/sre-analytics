name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Docker secrets are configured
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "secrets_available=true" >> $GITHUB_OUTPUT
            echo "✅ Docker Hub credentials configured"
          else
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Docker Hub credentials not configured - skipping Docker build/push"
            echo "📝 To enable: Add DOCKER_USERNAME and DOCKER_PASSWORD to repository secrets"
          fi

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.secrets_available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.secrets_available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        if: steps.check-secrets.outputs.secrets_available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/sre-analytics
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        if: steps.check-secrets.outputs.secrets_available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sre-analytics:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sre-analytics:buildcache,mode=max

      - name: Docker build skipped notice
        if: steps.check-secrets.outputs.secrets_available == 'false'
        run: |
          echo "⏭️ Docker build/push skipped - credentials not configured"
          echo ""
          echo "To enable Docker deployments:"
          echo "1. Go to repository Settings → Secrets and variables → Actions"
          echo "2. Add DOCKER_USERNAME with your Docker Hub username"
          echo "3. Add DOCKER_PASSWORD with your Docker Hub access token"
          echo ""
          echo "For local development, Docker isn't required for testing."

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success'
    environment:
      name: staging
      url: https://staging.sre-analytics.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging (placeholder)
        run: |
          echo "🚀 Staging deployment placeholder"
          echo "ℹ️ Configure Kubernetes/Helm/deployment scripts here"
          echo ""
          echo "Example commands:"
          echo "  kubectl apply -f k8s/ --context=staging"
          echo "  helm upgrade --install sre-analytics ./helm/sre-analytics"

      - name: Run smoke tests (placeholder)
        run: |
          echo "🧪 Smoke tests placeholder"
          echo "ℹ️ Add health check endpoints and basic API tests"

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.result == 'success'
    environment:
      name: production
      url: https://sre-analytics.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production (placeholder)
        run: |
          echo "🚀 Production deployment placeholder"
          echo "ℹ️ Configure production deployment scripts here"
          echo ""
          echo "Example commands:"
          echo "  kubectl apply -f k8s/ --context=production"
          echo "  helm upgrade --install sre-analytics ./helm/sre-analytics"

      - name: Run smoke tests (placeholder)
        run: |
          echo "🧪 Production smoke tests placeholder"
          echo "ℹ️ Add comprehensive health checks and API tests"

      - name: Notify deployment success (placeholder)
        run: |
          echo "✅ Production deployment notification placeholder"
          echo "ℹ️ Configure Slack/email notifications here"
