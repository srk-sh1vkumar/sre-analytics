name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Docker secrets are configured
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "secrets_available=true" >> $GITHUB_OUTPUT
            echo "✅ Docker Hub credentials configured"
          else
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Docker Hub credentials not configured - skipping Docker build/push"
            echo "📝 To enable: Add DOCKER_USERNAME and DOCKER_PASSWORD to repository secrets"
          fi

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.secrets_available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.secrets_available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        if: steps.check-secrets.outputs.secrets_available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/sre-analytics
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        if: steps.check-secrets.outputs.secrets_available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sre-analytics:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sre-analytics:buildcache,mode=max

      - name: Docker build skipped notice
        if: steps.check-secrets.outputs.secrets_available == 'false'
        run: |
          echo "⏭️ Docker build/push skipped - credentials not configured"
          echo ""
          echo "To enable Docker deployments:"
          echo "1. Go to repository Settings → Secrets and variables → Actions"
          echo "2. Add DOCKER_USERNAME with your Docker Hub username"
          echo "3. Add DOCKER_PASSWORD with your Docker Hub access token"
          echo ""
          echo "For local development, Docker isn't required for testing."

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success'
    environment:
      name: staging
      url: https://staging.sre-analytics.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: main-${{ github.sha }}
          NAMESPACE: sre-analytics-staging
          DEPLOY_METHOD: kubernetes
        run: |
          echo "🚀 Deploying to staging environment..."
          bash scripts/deployment/deploy-staging.sh

      - name: Run smoke tests
        env:
          STAGING_URL: https://staging.sre-analytics.example.com
        run: |
          echo "🧪 Running smoke tests..."
          bash scripts/deployment/smoke-tests.sh staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.result == 'success'
    environment:
      name: production
      url: https://sre-analytics.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.ref_name }}
          NAMESPACE: sre-analytics
          DEPLOY_METHOD: kubernetes
          PRODUCTION_DEPLOY_CONFIRMED: true
        run: |
          echo "🚀 Deploying to production environment..."
          bash scripts/deployment/deploy-production.sh

      - name: Run smoke tests
        env:
          PRODUCTION_URL: https://sre-analytics.example.com
        run: |
          echo "🧪 Running production smoke tests..."
          bash scripts/deployment/smoke-tests.sh production

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "📊 Version: ${{ github.ref_name }}"
          echo "🔗 URL: https://sre-analytics.example.com"
          echo ""
          echo "ℹ️  Configure Slack/email notifications by setting up webhooks"
          echo "    Example: curl -X POST \$SLACK_WEBHOOK_URL -d '{\"text\":\"Deployed v${{ github.ref_name }}\"}'"
