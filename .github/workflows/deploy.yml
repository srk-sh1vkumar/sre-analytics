name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/sre-analytics
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sre-analytics:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sre-analytics:buildcache,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.sre-analytics.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to staging environment"
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/ --context=staging
          # Example: helm upgrade --install sre-analytics ./helm/sre-analytics -f values-staging.yaml

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on staging"
          # Add smoke test commands
          # Example: curl https://staging.sre-analytics.example.com/health

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://sre-analytics.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production environment"
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/ --context=production
          # Example: helm upgrade --install sre-analytics ./helm/sre-analytics -f values-production.yaml

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on production"
          # Add smoke test commands

      - name: Notify deployment success
        run: |
          echo "✅ Production deployment successful"
          # Add notification commands (Slack, email, etc.)
