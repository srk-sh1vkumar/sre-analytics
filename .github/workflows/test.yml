name: Test & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "Main requirements installed"

          # Install test dependencies if file exists
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt || echo "Test requirements installed"
          fi

          # Install API dependencies if file exists
          if [ -f requirements-api.txt ]; then
            pip install -r requirements-api.txt || echo "API requirements installed"
          fi

          # Ensure pytest and coverage are installed
          pip install pytest pytest-cov coverage

      - name: Run tests with coverage
        run: |
          # Run tests, continue on failure to upload coverage
          pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing -v || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

      - name: Check coverage threshold (advisory)
        run: |
          # Check coverage but don't fail build
          coverage report --fail-under=70 || echo "⚠️ Coverage below 70% threshold"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Run Black (code formatter check - advisory)
        run: |
          black --check --diff src/ tests/ || echo "⚠️ Code formatting issues found - run 'black src/ tests/' to fix"

      - name: Run isort (import sorting check - advisory)
        run: |
          isort --check-only --diff src/ tests/ || echo "⚠️ Import sorting issues found - run 'isort src/ tests/' to fix"

      - name: Run Flake8 (linting - advisory)
        run: |
          flake8 src/ tests/ --count --statistics --exit-zero

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install mypy types-PyYAML types-requests || true

      - name: Run MyPy (type checking - advisory)
        run: |
          if [ -f mypy.ini ]; then
            mypy src/ --config-file mypy.ini || echo "⚠️ Type checking issues found"
          else
            mypy src/ || echo "⚠️ Type checking issues found (no config)"
          fi

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety || echo "Security tools installed"

      - name: Run Bandit (security linting - advisory)
        run: |
          # Create reports directory if doesn't exist
          mkdir -p security-reports

          # Run bandit and save report
          bandit -r src/ -f json -o security-reports/bandit-report.json || echo "⚠️ Security issues found"
          bandit -r src/ || echo "⚠️ Bandit found potential security issues"

      - name: Run Safety (dependency vulnerability check - advisory)
        run: |
          # Run safety check but don't fail build
          safety check --json > security-reports/safety-report.json 2>&1 || echo "⚠️ Vulnerability check completed"
          safety check || echo "⚠️ Dependencies may have known vulnerabilities"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30

  integration-test:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()  # Run even if test/lint have warnings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt || true
          fi

          if [ -f requirements-api.txt ]; then
            pip install -r requirements-api.txt || true
          fi

          pip install pytest

      - name: Run integration tests (if they exist)
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration/ -v --tb=short || echo "⚠️ Integration tests had failures"
          else
            echo "ℹ️ No integration tests found"
          fi

      - name: Run API tests (if they exist)
        run: |
          if [ -d tests/api ]; then
            pytest tests/api/ -v --tb=short || echo "⚠️ API tests had failures"
          else
            echo "ℹ️ No API tests found"
          fi

      - name: Run ML tests (if they exist)
        run: |
          if [ -d tests/ml ]; then
            pytest tests/ml/ -v --tb=short || echo "⚠️ ML tests had failures"
          else
            echo "ℹ️ No ML tests found"
          fi

  quality-summary:
    runs-on: ubuntu-latest
    needs: [test, lint, type-check, security]
    if: always()

    steps:
      - name: Quality gates summary
        run: |
          echo "# 🎯 Quality Checks Summary"
          echo ""
          echo "## Results"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Linting: ${{ needs.lint.result }}"
          echo "- Type Check: ${{ needs.type-check.result }}"
          echo "- Security: ${{ needs.security.result }}"
          echo ""
          echo "All checks are advisory - review artifacts for details"
